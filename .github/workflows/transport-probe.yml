name: Diagnostic transport host tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-transport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/transport_probe/requirements-test.txt
      - name: Install pinned test-only Lua VM
        run: |
          python -m pip install --only-binary=:all: --no-deps -r tools/transport_probe/requirements-test.txt
      - name: Install native test-only LuaSec and LuaSocket
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.1 lua-sec lua-socket
          lua5.1 -e 'assert(_VERSION == "Lua 5.1"); assert(require("ssl")._VERSION == "1.3.2"); assert(require("ssl.https")._VERSION == "1.3.2")'
      - name: Prepare pinned native KOReader SQLite reference
        run: |
          curl -fL --retry 2 --max-time 120 -o "$RUNNER_TEMP/koreader-sqlite.tar.xz" \
            https://github.com/koreader/koreader/releases/download/v2026.07.1/koreader-linux-x86_64-v2026.07.1.tar.xz
          python tools/plugin/prepare_sqlite_reference.py --archive "$RUNNER_TEMP/koreader-sqlite.tar.xz" --output "$RUNNER_TEMP/koreader-sqlite-reference"
      - name: Plugin, read-only Statistics and owned outbox fixtures (no physical proof)
        env:
          READING_SQLITE_REFERENCE_DIR: ${{ runner.temp }}/koreader-sqlite-reference
        run: |
          python -m unittest discover -s tools/plugin -p 'test_*.py' -v
          python tools/plugin/package.py --output "$RUNNER_TEMP/quartzo-bootstrap.zip"
      - name: Lua 5.1, TLS, bundle and process tests (no Kindle proof)
        run: |
          python -m unittest discover -s tools/transport_probe -p 'test_*.py' -v
      - name: Pinned Reading wire and gated pairing consumers (no production registration)
        env:
          READING_WIRE_REFERENCE_DIR: ${{ runner.temp }}/quartzo-reading-wire-reference
          READING_NATIVE_LUA51: /usr/bin/lua5.1
        run: |
          python tools/reading_wire/verify_upstream.py
          python tools/reading_wire/prepare_reference_runtime.py "$READING_WIRE_REFERENCE_DIR"
          python -m unittest discover -s tools/reading_wire -p 'test_*.py' -v
